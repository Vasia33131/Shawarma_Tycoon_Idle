<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="./style.css">

    <!-- Yandex Games SDK -->
    <script src="/sdk.js"></script>

    <style>
        canvas:focus {
            outline: none;
        }

        html, body {
            padding: 0;
            margin: 0;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: rgba(0,0,0,0);
            height: 100%;
        }
    </style>

    <!-- Экран загрузки «Шаурма Тайкун» (V7): вечерняя картинка ларька, золотая капсула прогресса.
         Селекторы с двумя id — сильнее CSS полосы, который PluginYG дописывает в style.css при сборке. -->
    <style>
        body {
            background: #5B4B8A;
        }

        body #loading-cover {
            overflow: hidden;
            background: linear-gradient(180deg, #5B4B8A 0%, #B5ABC5 22%, #D4A192 45%, #8A534C 78%, #5E3A3A 100%);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        }

        /* Размытая копия на весь экран — поля по бокам (ландшафт) или сверху и снизу (портрет). */
        #loading-cover #cozy-backdrop {
            position: absolute;
            inset: -40px;
            background: url('Images/loading_bg.jpg') center 45% / cover no-repeat;
            filter: blur(22px) brightness(0.85);
        }

        /* Картинка целиком, вписана в экран; края мягко тают в размытый фон. */
        #loading-cover #cozy-art {
            position: absolute;
            left: 50%;
            top: 50%;
            width: min(100vw, 100vh);
            height: min(100vw, 100vh);
            transform: translate(-50%, -50%);
            background: url('Images/loading_bg.jpg') center / contain no-repeat;
            -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 9%, #000 91%, transparent 100%);
            mask-image: linear-gradient(90deg, transparent 0, #000 9%, #000 91%, transparent 100%);
        }

        @media (orientation: portrait) {
            #loading-cover #cozy-art {
                top: 44%;
                -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 10%, #000 86%, transparent 100%);
                mask-image: linear-gradient(180deg, transparent 0, #000 10%, #000 86%, transparent 100%);
            }
        }

        /* Полоса загрузки — внизу, на размытой мостовой картинки. */
        #loading-cover #unity-loading-bar {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 11%;
        }

        #loading-cover #unity-progress-bar-empty {
            width: min(64vw, 440px);
            height: 26px;
            margin: 0;
            padding: 4px;
            border: none;
            border-radius: 999px;
            background: rgba(74, 44, 29, 0.4);
            box-shadow: 0 2px 10px rgba(74, 44, 29, 0.35);
        }

        #loading-cover #unity-progress-bar-full {
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(180deg, #FFDF85 0%, #FFCF5A 55%, #E9AE34 100%);
            box-shadow: 0 0 10px rgba(255, 207, 90, 0.55);
        }

        #loading-cover .spinner {
            border-top-color: rgba(255, 207, 90, 0.25);
            border-right-color: rgba(255, 207, 90, 0.25);
            border-bottom-color: rgba(255, 207, 90, 0.25);
            border-left-color: #FFCF5A;
        }
    </style>

    <!-- Additional head modules -->

</head>
<body class="{{{ SPLASH_SCREEN_STYLE.toLowerCase() }}}">

    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>
    <div id="loading-cover" style="display:none;">
        <div id="cozy-backdrop"></div>
        <div id="cozy-art"></div>
        <div id="unity-loading-bar">
            <div id="unity-logo"><img src="Images/logo.png"></div>
            <div id="unity-progress-bar-empty" style="display: none;">
                <div id="unity-progress-bar-full"></div>
            </div>
            <div class="spinner"></div>
        </div>
    </div>

    <!-- Additional body modules -->

    <script>
        const hideFullScreenButton = "";
        const buildUrl = "Build";
        const loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
        const config = {
            dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
            frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
            codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
            #if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
            #endif
        #if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
            #endif
        streamingAssetsUrl: "StreamingAssets",
            companyName: "{{{ COMPANY_NAME }}}",
            productName: "{{{ PRODUCT_NAME }}}",
            productVersion: "{{{ PRODUCT_VERSION }}}"
        };

        const container = document.querySelector("#unity-container");
        const canvas = document.querySelector("#unity-canvas");
        const loadingCover = document.querySelector("#loading-cover");
        const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");
        const spinner = document.querySelector('.spinner');

        const canFullscreen = (function () {
            for (const key of [
                'exitFullscreen',
                'webkitExitFullscreen',
                'webkitCancelFullScreen',
                'mozCancelFullScreen',
                'msExitFullscreen',
            ]) {
                if (key in document) {
                    return true;
                }
            }
            return false;
        }());

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            container.className = "unity-mobile";
            //config.devicePixelRatio = 1;
        }

        // The background image when loading the game. When building a build, the code changes depending on the project settings.
#if BACKGROUND_FILENAME
        var backgroundUnity = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#endif
        loadingCover.style.background = "url('Images/background.png') center / cover";
        loadingCover.style.display = "";

        let StartUnityInstance;
        let ygGameInstance = null;
        let ysdk = null;
        let initYSDK = false;
        let initSDKMessageSent = false;
        let initGame = false;
        let syncInit = false;
        let isVisibility = true;
        let isPausedGame = false;
        const NO_DATA = 'no data';

        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('visibilitychange', () => SetVisibility(!document.hidden));
        window.addEventListener('blur', () => SetVisibility(false));
        window.addEventListener('focus', () => SetVisibility(true));

        window.addEventListener('pointerdown', () => {
            FocusGame();
            SetVisibility(true);
        });

        window.addEventListener('resize', () => FocusGame());
        document.addEventListener('fullscreenchange', () => FocusGame());

        const oRequestPointerLock = Element.prototype.requestPointerLock;
        Element.prototype.requestPointerLock = async function hkRequestPointerLock(...args) {
            try {
                (args[0] ||= {}).unadjustedMovement = true;
                await oRequestPointerLock.apply(this, args);
            } catch (err) {
                console.log(err);
            }
        };

        function InstallBlurFocusBlocker() {
            if (!('onblur' in document)) return;
            if (window.blurFocusHandlersInstalled) return;

            window.addEventListener('blur', function () {
                let blockerButton = document.createElement('button');
                blockerButton.style.position = 'fixed';
                blockerButton.style.top = '0';
                blockerButton.style.left = '0';
                blockerButton.style.width = '100%';
                blockerButton.style.height = '100%';
                blockerButton.style.zIndex = '9999';
                blockerButton.style.backgroundColor = 'rgba(0, 0, 0, 0)';
                blockerButton.style.border = 'none';
                blockerButton.style.cursor = 'default';

                document.body.appendChild(blockerButton);

                function removeBlocker() {
                    if (blockerButton && blockerButton.parentNode) {
                        blockerButton.parentNode.removeChild(blockerButton);
                    }
                    window.removeEventListener('focus', removeBlocker);
                }

                window.addEventListener('focus', removeBlocker);
            });

            window.blurFocusHandlersInstalled = true;
        }

        function FocusGame(checkingPauseStatus = true) {
            if (!canvas) return;

            requestAnimationFrame(() => {
                if (checkingPauseStatus && isPausedGame) return;

                const active = document.activeElement;
                if (active && (active.tagName === 'INPUT' ||
                    active.tagName === 'TEXTAREA' ||
                    active.isContentEditable
                )) {
                    return;
                }

                canvas.focus({ preventScroll: true });
            });
        }

        function SetVisibility(visibility) {
            if (ysdk !== null && initGame === true && isVisibility !== visibility) {
                isVisibility = visibility;
                if (!visibility) {
                    YG2Instance('SetFocusWindowGame', 'false');
                }
                else {
                    YG2Instance('SetFocusWindowGame', 'true');
                }
            }
        }

        const PauseCallback = () => {
            isPausedGame = true;
            YG2Instance('SetPauseGame', 'true');
        };

        const ResumeCallback = () => {
            isPausedGame = false;
            YG2Instance('SetPauseGame', 'false');
            FocusGame();
        };

        const script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            StartUnityInstance = function () {
                createUnityInstance(canvas, config, (progress) => {
                    spinner.style.display = "none";
                    progressBarEmpty.style.display = "";
                    const adjustedProgress = Math.max(progress, 0.05);
                    progressBarFull.style.width = `${100 * adjustedProgress}%`;
                }).then((unityInstance) => {
                    ygGameInstance = unityInstance;
                    SendInitSDKComplete();

                    loadingCover.style.background = "";
                    loadingCover.style.display = "none";
                    FocusGame();
                    // Fill Background [Build Modify]
                }).catch((message) => {
                    console.error(message);
                });
            };
            
            InstallBlurFocusBlocker();
            InitYSDK();
            
            if (IsLocalHost() || syncInit)
                StartUnityInstance_IfUnloaded();
        };

        function StartUnityInstance_IfUnloaded() {
            if (spinner.style.display !== "none")
                StartUnityInstance();
        }

        function IsLocalHost() {
            try {
                if (window.top !== window)
                    return false;

                const host = window.location.hostname;
                const isLocalAddress = window.location.protocol === "file:" ||
                    host === "localhost" ||
                    host === "127.0.0.1" ||
                    host === "::1" ||
                    host.endsWith(".local");

                if (isLocalAddress && !IsYandexSDKAvailable()) {
                    LogStyledMessage("Local Host Without Yandex SDK");
                    return true;
                }

                return false;
            }
            catch (error) {
                console.error("Error checking the local host:", error);
                return false;
            }
        }

        function IsYandexSDKAvailable() {
            return typeof YaGames !== "undefined" && typeof YaGames.init === "function";
        }

        function SendInitSDKComplete() {
            if (!initYSDK || ygGameInstance == null || initSDKMessageSent)
                return;

            ygGameInstance.SendMessage('YG2Instance', 'InitSDKComplete');
            initSDKMessageSent = true;
        }

        let pendingYG2Messages = [];
        let pendingYG2Timer = null;

        function YG2Instance(method, arg) {
            if (ygGameInstance == null)
                return;

            if (!initGame || pendingYG2Messages.length > 0) {
                pendingYG2Messages.push({ method: method, arg: arg });

                if (pendingYG2Timer === null)
                    pendingYG2Timer = setTimeout(FlushYG2Messages, 100);

                return;
            }

            SendYG2Message(method, arg);
        }

        function FlushYG2Messages() {
            pendingYG2Timer = null;

            const queue = pendingYG2Messages;
            pendingYG2Messages = [];

            if (ygGameInstance == null)
                return;

            for (let i = 0; i < queue.length; i++)
                SendYG2Message(queue[i].method, queue[i].arg);
        }

        function SendYG2Message(method, arg) {
            if (arg === undefined)
                ygGameInstance.SendMessage('YG2Instance', method);
            else
                ygGameInstance.SendMessage('YG2Instance', method, arg);
        }

        function LogStyledMessage(message, style = 'color: #FFDF73; background-color: #454545') {
            console.log('%c' + message, style);
        }

        async function InitYSDK() {
            try {
                if (IsLocalHost()) return;

                ysdk = await YaGames.init();
                ysdk.on('game_api_pause', PauseCallback);
                ysdk.on('game_api_resume', ResumeCallback);

                // Additional init0 modules

                // Additional init1 modules

                // Additional init2 modules

                // Additional init modules

                initYSDK = true;
                SendInitSDKComplete();

                LogStyledMessage('Init YandexSDK Success');

            } catch (e) {
                console.error('CRASH Initialization SDK: ', e);
            }

            if (!IsLocalHost() && !syncInit)
                StartUnityInstance_IfUnloaded();
        }

        function InitGame() {
            initGame = true;

            setTimeout(function () {
                if (isPausedGame == true)
                    YG2Instance('SetPauseGame', 'true');
            }, 0);

            // Additional start modules
        }

        // Additional script modules

        document.body.appendChild(script);
    </script>
</body>
</html>
