<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="./style.css">

    <!-- Yandex Games SDK -->
    <script src="/sdk.js"></script>

    <style>
        canvas:focus {
            outline: none;
        }

        html, body {
            padding: 0;
            margin: 0;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: rgba(0,0,0,0);
            height: 100%;
        }
    </style>

    <!-- Экран загрузки «Шаурма Тайкун» (V7): вечерняя картинка ларька, золотая капсула прогресса.
         Селекторы с двумя id — сильнее базовых стилей полосы из style.css. -->
    <style>
        body {
            background: #5B4B8A;
        }

        body #loading-cover {
            overflow: hidden;
            background: linear-gradient(180deg, #5B4B8A 0%, #B5ABC5 22%, #D4A192 45%, #8A534C 78%, #5E3A3A 100%);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        }

        /* Размытая копия на весь экран — поля по бокам (ландшафт) или сверху и снизу (портрет). */
        #loading-cover #cozy-backdrop {
            position: absolute;
            inset: -40px;
            background: url('Images/loading_bg.jpg') center 45% / cover no-repeat;
            filter: blur(22px) brightness(0.85);
        }

        /* Картинка целиком, вписана в экран; края мягко тают в размытый фон. */
        #loading-cover #cozy-art {
            position: absolute;
            left: 50%;
            top: 50%;
            width: min(100vw, 100vh);
            height: min(100vw, 100vh);
            transform: translate(-50%, -50%);
            background: url('Images/loading_bg.jpg') center / contain no-repeat;
            -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 9%, #000 91%, transparent 100%);
            mask-image: linear-gradient(90deg, transparent 0, #000 9%, #000 91%, transparent 100%);
        }

        @media (orientation: portrait) {
            #loading-cover #cozy-art {
                top: 44%;
                -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 10%, #000 86%, transparent 100%);
                mask-image: linear-gradient(180deg, transparent 0, #000 10%, #000 86%, transparent 100%);
            }
        }

        /* Полоса загрузки — внизу, на размытой мостовой картинки. */
        #loading-cover #unity-loading-bar {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 11%;
        }

        #loading-cover #unity-progress-bar-empty {
            width: min(64vw, 440px);
            height: 26px;
            margin: 0;
            padding: 4px;
            border: none;
            border-radius: 999px;
            background: rgba(74, 44, 29, 0.4);
            box-shadow: 0 2px 10px rgba(74, 44, 29, 0.35);
        }

        #loading-cover #unity-progress-bar-full {
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(180deg, #FFDF85 0%, #FFCF5A 55%, #E9AE34 100%);
            box-shadow: 0 0 10px rgba(255, 207, 90, 0.55);
        }

        #loading-cover .spinner {
            border-top-color: rgba(255, 207, 90, 0.25);
            border-right-color: rgba(255, 207, 90, 0.25);
            border-bottom-color: rgba(255, 207, 90, 0.25);
            border-left-color: #FFCF5A;
        }
    </style>

</head>
<body class="{{{ SPLASH_SCREEN_STYLE.toLowerCase() }}}">

    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>
    <div id="loading-cover" style="display:none;">
        <div id="cozy-backdrop"></div>
        <div id="cozy-art"></div>
        <div id="unity-loading-bar">
            <div id="unity-progress-bar-empty" style="display: none;">
                <div id="unity-progress-bar-full"></div>
            </div>
            <div class="spinner"></div>
        </div>
    </div>

    <script>
        // Шаблон «Шаурма Тайкун» для Яндекс Игр — без PluginYG2.
        // Порядок (требования 1.1, 1.19.1): /sdk.js → YaGames.init() → только потом createUnityInstance.
        // Вся работа с SDK после старта — в Assets/_Game/Plugins/WebGL/YandexBridge.jslib через глобальные ysdk и ygGameInstance.
        var ysdk = null;
        var ygGameInstance = null;

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
        var config = {
            dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
            frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
            codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
            memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
            symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
            streamingAssetsUrl: "StreamingAssets",
            companyName: "{{{ COMPANY_NAME }}}",
            productName: "{{{ PRODUCT_NAME }}}",
            productVersion: "{{{ PRODUCT_VERSION }}}"
        };

        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingCover = document.querySelector("#loading-cover");
        var progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        var spinner = document.querySelector(".spinner");

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent))
            container.className = "unity-mobile";

        // Десктоп (требование 1.6.2.2): длинная сторона поля не больше двух коротких — в окне 21:9 или узком
        // поле по центру, по краям фон страницы. На телефоне поле на весь экран.
        function FitDesktopAspect() {
            if (container.className === "unity-mobile") return;
            var w = window.innerWidth;
            var h = window.innerHeight;
            var cw = Math.min(w, 2 * h);
            var ch = Math.min(h, 2 * w);
            container.style.width = cw + "px";
            container.style.height = ch + "px";
            container.style.left = Math.floor((w - cw) / 2) + "px";
            container.style.top = Math.floor((h - ch) / 2) + "px";
        }

        function FocusGame() {
            if (canvas) canvas.focus({ preventScroll: true });
        }

        // Требования 1.6.1.3, 1.10.1: на телефоне поворот и выход из полноэкранного режима не всегда успевают прислать resize.
        function OnViewportChanged() {
            FitDesktopAspect();
            FocusGame();
        }

        FitDesktopAspect();
        window.addEventListener("resize", OnViewportChanged);
        window.addEventListener("orientationchange", OnViewportChanged);
        document.addEventListener("fullscreenchange", OnViewportChanged);

        // Требования 1.6.1.8, 1.6.2.7: долгий тап и правый клик не открывают меню и не выделяют текст (плюс CSS выше).
        document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
        document.addEventListener("selectstart", function (e) { e.preventDefault(); });
        window.addEventListener("pointerdown", FocusGame);

        loadingCover.style.display = "";

        // SDK: на Яндексе /sdk.js есть всегда. Без него (локальный запуск) игра стартует без SDK — мост это видит (статус nosdk).
        // Ошибка инициализации тоже не блокирует запуск: игра работает гостем без облака, рекламы и покупок.
        var sdkReady = new Promise(function (resolve) {
            if (typeof YaGames === "undefined" || typeof YaGames.init !== "function") {
                console.warn("Yandex Games SDK is not available — starting without it.");
                resolve();
                return;
            }
            YaGames.init().then(function (sdk) {
                ysdk = sdk;
                resolve();
            }).catch(function (e) {
                console.error("Yandex Games SDK init failed:", e);
                resolve();
            });
        });

        // Загрузчик Unity качается параллельно с инициализацией SDK, а сам движок стартует только после неё.
        var loaderReady = new Promise(function (resolve, reject) {
            var script = document.createElement("script");
            script.src = loaderUrl;
            script.onload = resolve;
            script.onerror = function () { reject(new Error("Unity loader failed to load")); };
            document.body.appendChild(script);
        });

        Promise.all([sdkReady, loaderReady]).then(function () {
            return createUnityInstance(canvas, config, function (progress) {
                spinner.style.display = "none";
                progressBarEmpty.style.display = "";
                progressBarFull.style.width = (100 * Math.max(progress, 0.05)) + "%";
            });
        }).then(function (unityInstance) {
            ygGameInstance = unityInstance;
            loadingCover.style.display = "none";
            FocusGame();
        }).catch(function (message) {
            console.error(message);
        });
    </script>
</body>
</html>
